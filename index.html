<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ventilator Simulator</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: system-ui, sans-serif; background: #0f1a17; color: #e9f1ed; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; grid-template-columns: 320px 1fr; }
      @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
      h1 { font-size: 20px; margin: 16px 16px 0; max-width: 1100px; }
      .panel { background: #16241f; border: 1px solid #243a33; border-radius: 10px; padding: 14px; }
      .control { margin-bottom: 12px; }
      .control label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
      .control input[type=range] { width: 100%; }
      .control input[type=number] { width: 80px; }
      canvas { width: 100%; height: 480px; display: block; }
      #metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin-top: 12px; }
      .metric { background: #1d2f29; border-radius: 8px; padding: 8px 10px; }
      .metric .k { font-size: 11px; opacity: 0.7; }
      .metric .v { font-size: 18px; font-weight: 700; }
      .status { font-weight: 700; padding: 6px 10px; border-radius: 6px; display: inline-block; }
      .status.ok { background: #1f5a45; } .status.review { background: #6b5320; } .status.risk { background: #7a2a2a; }
      .goals { font-size: 13px; margin-top: 8px; line-height: 1.6; }
      button { margin-top: 4px; }
    </style>
    <script type="module" crossorigin src="./assets/index-Du1I7aVe.js"></script>
  </head>
  <body>
    <h1>Mechanical Ventilation Simulator</h1>
    <main>
      <section class="panel" id="controls"></section>
      <section class="panel">
        <canvas id="wave"></canvas>
        <div id="status"></div>
        <div id="metrics"></div>
        <div class="goals" id="goals"></div>
      </section>
    </main>
  </body>
</html>
